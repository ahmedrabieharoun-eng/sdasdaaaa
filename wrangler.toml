name = "silent-mode-0a66"
main = "worker.js"
compatibility_date = "2024-09-23"

# Serves the frontend (index.html + style.css) for any non-/api/* request.
[assets]
directory = "./public"
binding = "ASSETS"

# Create with: wrangler kv namespace create GD_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "GD_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Secrets (do NOT put these here — set them with wrangler secret put):
#   wrangler secret put BOT_TOKEN
#   wrangler secret put ADMIN_SECRET
